<div id="app" class="dgm-app">
  <div id="stage">
    <canvas id="gameCanvas" aria-label="Razebait game area" role="img"></canvas>

    <div id="hud">
      <div class="hud-top">
        <div class="logo">
          <div class="title">RAZE<span>BAIT</span></div>
          <div class="tagline">RUN. FAIL. REPEAT.</div>
        </div>
        <div class="level-card" id="levelCard">
          <div class="lvl" id="levelLabel">LEVEL 1</div>
          <div class="sub" id="levelSub">Trust</div>
        </div>
        <div class="top-buttons">
          <button type="button" class="icon-btn" id="btnRestart" title="Restart level (R)" aria-label="Restart level">&#8635;</button>
          <button type="button" class="icon-btn" id="btnFullscreen" title="Fullscreen" aria-label="Toggle fullscreen" hidden>&#x26F6;</button>
          <button type="button" class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">&#9881;</button>
          <button type="button" class="icon-btn" id="btnPause" title="Pause (Esc)" aria-label="Pause">&#10074;&#10074;</button>
        </div>
      </div>
      <div class="progress-pill"><span id="progressText">1 / 5</span><span class="deaths" id="deathsText">Deaths: 0</span></div>
      <div class="world-toast" id="worldToast" aria-live="polite"><span class="w1" id="worldToastSub">LEVEL 1</span><span id="worldToastMain">TRUST</span></div>
      <div class="toast-msg" id="toastMsg" aria-live="polite"></div>
    </div>

    <div class="controls" id="touchControls">
      <div class="dpad" id="dpad">
        <button type="button" class="ctrl-btn" id="btnLeft" aria-label="Move left">&#8592;</button>
        <button type="button" class="ctrl-btn" id="btnRight" aria-label="Move right">&#8594;</button>
      </div>
      <button type="button" class="jump-btn" id="btnJump" aria-label="Jump">&#8593;<span>JUMP</span></button>
    </div>

    <!-- Win overlay -->
    <div class="overlay dim" id="winOverlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <div class="card">
        <h2 id="winTitle">Level Complete!</h2>
        <p class="msg" id="winMsg">&nbsp;</p>
        <p class="stats" id="winStats"></p>
        <div class="row">
          <button type="button" class="btn primary" id="btnNext">NEXT LEVEL &#8594;</button>
          <button type="button" class="btn ghost" id="btnReplay">REPLAY</button>
          <button type="button" class="btn ghost" id="btnWinMenu" hidden>LEVEL SELECT</button>
        </div>
        <p class="hint" id="winHint">Press Enter to continue</p>
      </div>
    </div>

    <!-- Pause overlay -->
    <div class="overlay dim" id="pauseOverlay" role="dialog" aria-modal="true" aria-label="Paused">
      <div class="card">
        <h2>Paused</h2>
        <div class="row col">
          <button type="button" class="btn primary" id="btnResume">RESUME</button>
          <button type="button" class="btn ghost" id="btnPauseRestart">RESTART LEVEL</button>
          <button type="button" class="btn ghost" id="btnPauseSettings">SETTINGS</button>
          <button type="button" class="btn ghost" id="btnPauseMenu">LEVEL SELECT</button>
        </div>
      </div>
    </div>

    <!-- Settings overlay -->
    <div class="overlay dim" id="settingsOverlay" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="card">
        <h2>Settings</h2>
        <div class="settings-list">
          <div class="setting-row"><span>Sound Effects</span><button type="button" class="switch" role="switch" aria-checked="false" aria-label="Sound effects" data-setting="sound"><span class="knob"></span></button></div>
          <div class="setting-row"><span>Music</span><button type="button" class="switch" role="switch" aria-checked="false" aria-label="Music" data-setting="music"><span class="knob"></span></button></div>
          <div class="setting-row"><span>Vibration</span><button type="button" class="switch" role="switch" aria-checked="false" aria-label="Vibration" data-setting="vibration"><span class="knob"></span></button></div>
          <div class="setting-row"><span>Reduced Motion</span><button type="button" class="switch" role="switch" aria-checked="false" aria-label="Reduced motion" data-setting="reducedMotion"><span class="knob"></span></button></div>
        </div>
        <button type="button" class="btn primary" id="btnCloseSettings">DONE</button>
      </div>
    </div>

    <!-- Level select -->
    <div class="overlay dim" id="menuOverlay" role="dialog" aria-modal="true" aria-label="Select level">
      <div class="card wide">
        <h2>Select Level</h2>
        <div class="level-select-grid" id="levelGrid"></div>
        <button type="button" class="btn ghost" id="btnCloseMenu">CLOSE</button>
      </div>
    </div>

    <!-- Start screen -->
    <div id="startScreen">
      <div class="bigtitle">RAZE<span>BAIT</span></div>
      <div class="bigtag">RUN. FAIL. REPEAT.</div>
      <canvas id="introCanvas" width="200" height="90"></canvas>
      <div class="menu-row">
        <button type="button" class="btn primary" id="btnPlay">PLAY</button>
        <button type="button" class="btn ghost" id="btnLevelSelectStart">LEVELS</button>
        <button type="button" class="btn ghost" id="btnSettingsStart">SETTINGS</button>
      </div>
      <p class="start-hint" id="startHint">&#8592; &#8594; / A D to move &middot; &#8593; / W / Space to jump &middot; R to restart</p>
    </div>
  </div>
</div>
